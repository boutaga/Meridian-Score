services:
  simulator:
    build:
      context: ..
      dockerfile: simulator/Dockerfile
    ports:
      # Loopback only: the simulator has no authentication (SECURITY.md).
      - "127.0.0.1:3000:3000"
    volumes:
      - ../data:/app/data:ro
      - ../src:/app/src:ro
      - ./:/app/simulator
      - /app/simulator/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
