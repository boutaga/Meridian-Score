name: Catalog Change Review

on:
  pull_request:
    paths:
      - 'data/metrics/**'
      - 'src/scoring/policy.js'
      - 'scripts/generate-docs.js'
      - 'docs/scoring-model.md'
      - 'docs/technologies/**'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate modified catalogs
        run: npm run validate-catalogs

      - name: Regenerate docs and check for drift
        run: |
          npm run generate-docs
          if git diff --quiet docs/; then
            echo "Docs are up to date."
          else
            echo "::error::Generated documentation is out of date (docs/technologies or the scoring policy block). Run 'npm run generate-docs' and commit."
            git --no-pager diff --stat docs/
            exit 1
          fi

      - name: Benchmark changed catalogs
        id: benchmark
        run: |
          REPORT=""
          CHANGED_CATALOGS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- data/metrics/*.json)

          if [ -z "$CHANGED_CATALOGS" ]; then
            echo "No catalog files changed."
            echo "report=No catalog changes detected." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for FILE in $CHANGED_CATALOGS; do
            TECH=$(basename "$FILE" .json)
            echo "Benchmarking $TECH..."

            # The benchmark loads the ORIGINAL from the package's own data file and
            # takes the MODIFIED file as an argument. Swap the base-branch version in
            # as the original, pass the PR version as the modified one, then restore.
            git show origin/${{ github.base_ref }}:$FILE > /tmp/original-${TECH}.json 2>/dev/null || continue
            cp "$FILE" /tmp/modified-${TECH}.json
            cp /tmp/original-${TECH}.json "$FILE"
            OUTPUT=$(node scripts/benchmark-catalog.js "$TECH" /tmp/modified-${TECH}.json 2>&1) || true
            git checkout -- "$FILE"
            REPORT="${REPORT}\n### ${TECH}\n\`\`\`\n${OUTPUT}\n\`\`\`\n"
          done

          # Write report to file (multi-line output)
          echo "$REPORT" > /tmp/benchmark-report.md

      - name: Post benchmark report as PR comment
        if: steps.benchmark.outputs.report != 'No catalog changes detected.'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try {
              report = fs.readFileSync('/tmp/benchmark-report.md', 'utf8');
            } catch (e) {
              report = 'No benchmark report generated.';
            }

            const body = `## Catalog Benchmark Report\n\n${report}\n\n---\n*Auto-generated by catalog-review workflow*`;

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Catalog Benchmark Report'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
